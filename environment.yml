# ADOPPTRS - environnement conda (poste de travail, CPU)
#
#     conda env create -f environment.yml
#     conda activate adopptrs
#
# Les paquets scientifiques sont installes par pip plutot que par conda :
# les roues PyPI de torch, opencv et pyproj sont plus a jour et evitent les
# conflits de solveur entre les canaux conda-forge et pytorch.
#
# Cet environnement est CPU-only. Pour le cluster GPU, cf. la note
# "Cluster GPU" du README : la roue doit venir de l'index cu126.

name: adopptrs

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
    - -r requirements.txt
